name: Build & Deploy PWA (staging/production)

on:
  push:
    branches: [staging, production]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.HOSTINGER_HOST }}
      USER: ${{ secrets.HOSTINGER_USER }}
      KEY_B64: ${{ secrets.HOSTINGER_SSH_KEY }}
      DEFAULT_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine branch-specific paths & secrets
        id: vars
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if [ "$BRANCH" = "staging" ]; then
            TARGET_PATH="${{ secrets.HOSTINGER_STAGING_TARGET_PATH }}"
            PWA_ENV_B64="${{ secrets.PWA_ENV_B64_STAGING }}"
            SSH_PORT="${{ secrets.HOSTINGER_SSH_PORT_STAGING || secrets.DEFAULT_SSH_PORT || secrets.HOSTINGER_SSH_PORT }}"
          elif [ "$BRANCH" = "production" ]; then
            TARGET_PATH="${{ secrets.HOSTINGER_PRODUCTION_TARGET_PATH }}"
            PWA_ENV_B64="${{ secrets.PWA_ENV_B64_PRODUCTION }}"
            SSH_PORT="${{ secrets.HOSTINGER_SSH_PORT_PRODUCTION || secrets.DEFAULT_SSH_PORT || secrets.HOSTINGER_SSH_PORT }}"
          else
            echo "ERROR: unsupported branch: $BRANCH"
            exit 1
          fi

          echo "target_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"
          echo "pwa_env_b64=$PWA_ENV_B64" >> "$GITHUB_OUTPUT"
          echo "ssh_port=${SSH_PORT:-65002}" >> "$GITHUB_OUTPUT"

      - name: Decode .env from secret
        run: |
          ENV_B64="${{ steps.vars.outputs.pwa_env_b64 }}"
          if [ -z "$ENV_B64" ]; then
            echo "ERROR: Missing branch-specific .env secret!"
            exit 1
          fi
          CLEAN_ENV_B64=$(printf '%s' "$ENV_B64" | tr -d '\r')
          if ! printf '%s' "$CLEAN_ENV_B64" | grep -Eq '^[A-Za-z0-9+/]+={0,2}$'; then
            echo "ERROR: PWA_ENV_B64 contains invalid base64 characters."
            exit 1
          fi
          printf '%s' "$CLEAN_ENV_B64" | base64 --decode > .env
          chmod 600 .env
          echo ".env created."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "21"
          cache: "npm"

      - name: Install dependencies
        run: |
          test -f .env || (echo ".env missing; aborting" && exit 1)
          npm ci

      - name: Build PWA
        run: |
          CI=false npm run build
          ls -lah dist || (echo "dist/ not found" && exit 1)

      - name: Prepare SSH key & known_hosts
        run: |
          mkdir -p ~/.ssh
          CLEAN_B64=$(printf '%s' "${{ env.KEY_B64 }}" | tr -d '\r')
          printf '%s' "$CLEAN_B64" | base64 --decode > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          SSH_PORT="${{ steps.vars.outputs.ssh_port }}"
          # ensure host is known for given port
          ssh-keyscan -p "$SSH_PORT" -H "${{ env.HOST }}" >> ~/.ssh/known_hosts || true
          echo "SSH prepared (port=$SSH_PORT)."

      - name: Ensure remote target directory exists
        run: |
          SSH_PORT="${{ steps.vars.outputs.ssh_port }}"
          TARGET="${{ steps.vars.outputs.target_path }}"
          if [ -z "$TARGET" ]; then
            echo "ERROR: TARGET_BUILD_PATH is empty; did you set HOSTINGER_*_TARGET_PATH secrets?"
            exit 1
          fi
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "${{ env.USER }}@${{ env.HOST }}" \
            "mkdir -p '$TARGET' && echo 'Ensured: $TARGET'"

      - name: Rsync dist → remote (deploy)
        run: |
          SSH_PORT="${{ steps.vars.outputs.ssh_port }}"
          TARGET="${{ steps.vars.outputs.target_path }}"
          RSYNC_SSH="ssh -p $SSH_PORT -o StrictHostKeyChecking=no"
          rsync -e "$RSYNC_SSH" -avz --delete ./dist/ "${{ env.USER }}@${{ env.HOST }}:$TARGET/"

      - name: Cleanup runner
        run: |
          shred -u .env || rm -f .env || true
          rm -f ~/.ssh/id_rsa || true

      - name: Deployment complete
        run: |
          echo "PWA deployed to ${{ env.USER }}@${{ env.HOST }}:${{ steps.vars.outputs.target_path }} (branch: ${{ steps.vars.outputs.branch }})"
